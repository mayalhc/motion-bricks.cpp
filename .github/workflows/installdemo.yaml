name: CMake Build

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest
        build_type:
          - Release

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Install build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake \
            ninja-build \
            build-essential

      - name: Install Ninja (Windows)
        if: runner.os == 'Windows'
        run: choco install ninja -y

      - name: Install Ninja (macOS)
        if: runner.os == 'macOS'
        run: brew install ninja

      - name: Set up MSVC environment (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Set up Go environment
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache-dependency-path: |
            demo/go.sum
            bindings/go/go.sum

      - name: Configure CMake (Windows)
        if: runner.os == 'Windows'
        run: >
          cmake
          -S .
          -B build
          -G Ninja
          -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
          -DCMAKE_INSTALL_PREFIX=${{ github.workspace }}/install
          -DCMAKE_EXPORT_COMPILE_COMMANDS=ON
          -DMOTIONBRICKS_ENABLE_VULKAN=OFF
          -DMOTIONBRICKS_DOWNLOAD_MODELS=OFF

      - name: Configure CMake (Linux/macOS)
        if: runner.os != 'Windows'
        run: >
          cmake
          -S .
          -B build
          -G Ninja
          -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
          -DCMAKE_INSTALL_PREFIX=${{ github.workspace }}/install
          -DCMAKE_EXPORT_COMPILE_COMMANDS=ON
          -DMOTIONBRICKS_ENABLE_VULKAN=OFF
          -DMOTIONBRICKS_DOWNLOAD_MODELS=OFF

      - name: Build
        run: cmake --build build --config ${{ matrix.build_type }} --parallel

      - name: Run tests
        working-directory: build
        run: ctest -C ${{ matrix.build_type }} --output-on-failure
        continue-on-error: true

      - name: Install
        run: cmake --install build --config ${{ matrix.build_type }} --prefix install

      - name: Bundle GGML runtime libraries (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: mkdir -p install/bin && cp build/bin/*.dll install/bin/ || true

      - name: Bundle GGML runtime libraries (Linux/macOS)
        if: runner.os != 'Windows'
        run: mkdir -p install/lib && cp build/bin/* install/lib/ || true

      - name: Build Go Web Demo
        shell: bash
        env:
          CGO_ENABLED: "0"
        run: |
          cd demo
          if [ "${{ runner.os }}" = "Windows" ]; then
            go build -o ../install/bin/motionbricks-demo.exe .
          else
            go build -o ../install/bin/motionbricks-demo .
          fi
          mkdir -p ../install/bin/demo/web
          cp -r web/* ../install/bin/demo/web/

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: motion-bricks-${{ matrix.os }}
          path: install/
          if-no-files-found: error
